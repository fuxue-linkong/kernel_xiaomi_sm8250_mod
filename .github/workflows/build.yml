name: Build Kernel

on:
  push:
    branches: [ android15-lineage22-mod ]
  pull_request:
    branches: [ android15-lineage22-mod ]
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'elish'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU with SUSFS (ReSukiSU)'
        required: true
        type: boolean
        default: true

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device || 'elish' }} | ${{ github.event_name == 'push' && 'KSU' || (github.event.inputs.ksu == 'true' && 'KSU' || 'NoKSU') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf libncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache_mikernel
          key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device || 'elish' }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device || 'elish' }}-
            ${{ runner.os }}-kernel-ccache-

      - name: Setup proton-clang Toolchain
        run: |
          TC="$HOME/proton-clang/proton-clang-20210522/bin"
          mkdir -p "$TC"
          cd "$TC"
          ln -sf "$(command -v clang)" clang
          ln -sf "$(command -v ld.lld)" ld.lld
          for p in aarch64-linux-gnu arm-linux-gnueabi; do
            for t in ld as ar nm objcopy objdump strip readelf gcc g++ cpp; do
              if command -v $p-$t >/dev/null; then
                ln -sf "$(command -v $p-$t)" "$p-$t"
              fi
            done
          done
          # Enable ccache for clang via PATH symlink
          ln -sf "$(command -v ccache)" /usr/lib/ccache/clang

      - name: Run Build Script
        run: |
          chmod +x build.sh

          DEVICE="${{ github.event.inputs.device || 'elish' }}"
          ARGS="$DEVICE"

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="$ARGS ksu"
          elif [ "${{ github.event.inputs.ksu }}" = "true" ]; then
            ARGS="$ARGS ksu"
          fi

          echo "Executing command: ./build.sh $ARGS"
          ./build.sh $ARGS

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ github.event.inputs.device || 'elish' }}-${{ github.event_name == 'push' && 'KSU' || (github.event.inputs.ksu == 'true' && 'KSU' || 'NoKSU') }}-${{ github.run_id }}
          path: "*.zip"
          compression-level: 0
          if-no-files-found: ignore